# Comment tokens of every language package. The build copies the row of
# TARGET_LANG into the package's config.yaml as editor.comments, which Rune
# needs to toggle comments: without it the comment commands do nothing.
#
# Every language in languages.txt needs exactly one row, on one line, in
# the editor.comments schema:
#
#   <lang>: {line: [<prefix>, ...], block: [<start>, <end>, ...]}
#
# The first line prefix and the first block pair are the ones Rune inserts;
# the other prefixes are also removed when uncommenting. Rune tries the
# prefixes in order, so list a prefix before any shorter one it starts with.
# Rune follows a line prefix with a space but inserts block delimiters as
# they are, so a delimiter that must be a separate word carries its space.
# Rune only removes text the grammar's highlights capture as @comment, and a
# block pair only when that capture spans both delimiters, so a pair the
# grammar does not parse as one comment node (Go templates' {{/* */}}, MDX's
# {/* */}) is left out. A language with no comment syntax, or none Rune can
# toggle, gets {} and ships no config.yaml.
